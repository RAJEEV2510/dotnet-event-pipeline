name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

  # End-to-end test: deploy the whole pipeline (Postgres, Kafka, API, worker) to a throwaway
  # kind cluster, push events through the API and check they land in PostgreSQL.
  kubernetes:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -f src/EventProcessor.Api/Dockerfile -t event-pipeline-api:local .
          docker build -f src/EventProcessor.Worker/Dockerfile -t event-pipeline-worker:local .
          docker build -f tools/EventProcessor.LoadGen/Dockerfile -t event-pipeline-loadgen:local .

      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci

      - name: Load images into the cluster
        run: kind load docker-image event-pipeline-api:local event-pipeline-worker:local event-pipeline-loadgen:local --name ci

      - name: Deploy
        run: |
          kubectl apply -k .
          kubectl -n event-pipeline rollout status statefulset/postgres --timeout=180s
          kubectl -n event-pipeline rollout status statefulset/kafka --timeout=300s
          kubectl -n event-pipeline rollout status deployment/api --timeout=180s
          kubectl -n event-pipeline rollout status deployment/worker --timeout=180s

      - name: Send events and verify they reach PostgreSQL
        run: |
          kubectl -n event-pipeline port-forward svc/api 8080:80 > /dev/null 2>&1 &
          sleep 5
          COUNT=500
          for i in $(seq 1 $COUNT); do
            curl -sf -o /dev/null -X POST http://localhost:8080/api/events \
              -H 'Content-Type: application/json' \
              -d "{\"eventId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"type\":\"ci.k8s\",\"payload\":\"{\\\"n\\\":$i}\",\"createdAt\":\"$(date -u +%FT%TZ)\"}"
          done
          for attempt in $(seq 1 60); do
            STORED=$(kubectl -n event-pipeline exec statefulset/postgres -- psql -U postgres -tAc "SELECT count(*) FROM events WHERE type = 'ci.k8s'")
            echo "stored: $STORED / $COUNT"
            [ "$STORED" -ge "$COUNT" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Show consumer-group partition split across worker pods
        run: |
          kubectl -n event-pipeline exec statefulset/kafka -- \
            /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group event-processor

      - name: Benchmark - direct Kafka ingest, 1M events
        run: |
          NS=event-pipeline
          TOTAL=1000000
          # Switch the API to the high-throughput path and give it a second replica
          kubectl -n $NS set env deployment/api Ingest__Mode=Direct
          kubectl -n $NS scale deployment/api --replicas=2
          kubectl -n $NS scale deployment/worker --replicas=3
          kubectl -n $NS rollout status deployment/api --timeout=180s
          kubectl -n $NS rollout status deployment/worker --timeout=180s

          START=$(date +%s.%N)
          kubectl apply -f k8s/loadtest/loadgen-job.yaml
          # Stop on whichever comes first: the job completing or failing
          kubectl -n $NS wait --for=condition=complete job/loadgen --timeout=900s &
          kubectl -n $NS wait --for=condition=failed job/loadgen --timeout=900s && { kubectl -n $NS logs job/loadgen | tail -40; exit 1; } &
          wait -n
          kill $(jobs -p) 2>/dev/null || true
          INGEST_DONE=$(date +%s.%N)
          kubectl -n $NS logs job/loadgen | tail -25
          LOADGEN=$(kubectl -n $NS logs job/loadgen | grep LOADGEN_RESULT)

          for attempt in $(seq 1 450); do
            STORED=$(kubectl -n $NS exec statefulset/postgres -- psql -U postgres -tAc "SELECT count(*) FROM events WHERE type = 'load.test'")
            [ "$STORED" -ge "$TOTAL" ] && break
            sleep 2
          done
          END=$(date +%s.%N)
          echo "stored: $STORED / $TOTAL"

          INGEST_RATE=$(echo "$LOADGEN" | sed -E 's/.*rate=([0-9]+).*/\1/')
          E2E_SECONDS=$(awk "BEGIN { printf \"%.1f\", $END - $START }")
          E2E_RATE=$(awk "BEGIN { printf \"%.0f\", $STORED / ($END - $START) }")
          CPUS=$(nproc)

          {
            echo "## Throughput benchmark (single kind node, $CPUS vCPU GitHub runner)"
            echo ""
            echo "| Metric | Result |"
            echo "|---|---|"
            echo "| Events sent | $TOTAL |"
            echo "| Events stored in PostgreSQL | $STORED |"
            echo "| API accepted (HTTP -> Kafka, acks=all) | **$INGEST_RATE events/sec** |"
            echo "| End to end (HTTP -> Kafka -> worker -> PostgreSQL) | **$E2E_RATE events/sec** ($E2E_SECONDS s) |"
            echo "| Pods | api x2, worker x3, 12 partitions, everything on one node |"
          } | tee -a $GITHUB_STEP_SUMMARY

          [ "$STORED" -ge "$TOTAL" ]

      - name: Worker batch timings
        if: always()
        run: kubectl -n event-pipeline logs deployment/worker --tail=15 | grep BATCH_COMPLETE || true

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n event-pipeline get pods -o wide
          kubectl -n event-pipeline logs deployment/api --tail=200 || true
          kubectl -n event-pipeline logs deployment/worker --tail=200 --all-containers || true
          kubectl -n event-pipeline logs statefulset/kafka --tail=100 || true
          kubectl -n event-pipeline logs statefulset/postgres --tail=100 || true
