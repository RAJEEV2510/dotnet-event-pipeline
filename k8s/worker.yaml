# Every worker pod joins the same Kafka consumer group, so Kafka splits the topic's
# partitions between them. More pods than partitions (6) would leave pods idle,
# which is why the HPA stops at 6.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 30   # time to flush the in-flight batch and commit offsets
      containers:
        - name: worker
          image: event-pipeline-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: event-pipeline-config
            - secretRef:
                name: event-pipeline-db
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
